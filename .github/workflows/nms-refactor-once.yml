name: One-shot Direct NMS Refactor

on:
  push:
    branches:
      - feature/otherworld-custom-dimension-context

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/otherworld-custom-dimension-context
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Refactor reflection NMS to direct NMS
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # ParallelFurnace: MinecraftServer FuelValuesを直接参照
          p = root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/ParallelFurnace/ParallelFurnaceModule.java'
          s = p.read_text(encoding='utf-8')
          s = s.replace('import java.lang.reflect.Method;\n', '')
          if 'import org.bukkit.craftbukkit.CraftServer;' not in s:
              s = s.replace('import org.bukkit.block.data.Lightable;\n', 'import org.bukkit.block.data.Lightable;\nimport org.bukkit.craftbukkit.CraftServer;\nimport org.bukkit.craftbukkit.inventory.CraftItemStack;\n')
          s = re.sub(r'\n    private Object nmsFuelValues;\n    private Method nmsBurnDuration;\n    private Method nmsAsCopy;\n', '\n', s)
          fuel = '''    /** サーバー実装の FuelValues から燃焼時間を直接取得。 */
              private int lookupServerBurnTicks(Material material) {
                  if (nmsFuelUnavailable) {
                      return -1;
                  }
                  try {
                      CraftServer craftServer = (CraftServer) Bukkit.getServer();
                      net.minecraft.world.item.ItemStack nmsStack = CraftItemStack.asNMSCopy(new ItemStack(material));
                      return Math.max(0, craftServer.getServer().fuelValues().burnDuration(nmsStack));
                  } catch (Throwable t) {
                      nmsFuelUnavailable = true;
                      plugin.getLogger().info("[並列かまど] NMS燃料テーブルを利用できないため、内蔵のVanilla燃料表を使用します: " + t);
                      return -1;
                  }
              }
          '''
          s, count = re.subn(
              r'    /\*\* サーバー実装 \(FuelValues#burnDuration\).*?\n    }\n\n    /\*\* Vanilla の燃料表',
              fuel + '\n    /** Vanilla の燃料表', s, flags=re.S)
          if count != 1:
              raise SystemExit(f'ParallelFurnace fuel replacement count={count}')
          s = s.replace('まずサーバー内部の燃料テーブル (NMS FuelValues) をリフレクションで参照し、',
                        'まずサーバー内部の燃料テーブル (NMS FuelValues) を直接参照し、')
          p.write_text(s, encoding='utf-8')

          # WarpStone: camera/chunk-center packetを直接送信
          p = root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WarpStone/WarpStoneModule.java'
          s = p.read_text(encoding='utf-8')
          if 'import net.minecraft.network.protocol.game.ClientboundSetCameraPacket;' not in s:
              s = s.replace('package org.pexserver.koukunn.bettersurvival.Modules.Feature.WarpStone;\n\n',
                  'package org.pexserver.koukunn.bettersurvival.Modules.Feature.WarpStone;\n\n'
                  'import net.minecraft.network.protocol.game.ClientboundSetCameraPacket;\n'
                  'import net.minecraft.network.protocol.game.ClientboundSetChunkCacheCenterPacket;\n')
          if 'import org.bukkit.craftbukkit.entity.CraftEntity;' not in s:
              s = s.replace('import org.bukkit.entity.ArmorStand;\n',
                  'import org.bukkit.entity.ArmorStand;\nimport org.bukkit.craftbukkit.entity.CraftEntity;\nimport org.bukkit.craftbukkit.entity.CraftPlayer;\n')
          s = s.replace('バージョン差を避けるため reflection で呼び、失敗時だけ Bukkit API にフォールバックする。',
                        'paperweight-userdev のNMS packetを直接送り、失敗時だけ Bukkit API にフォールバックする。')
          direct_packets = '''    private boolean sendSetCameraPacket(Player viewer, org.bukkit.entity.Entity target) {
                  try {
                      CraftPlayer craftViewer = (CraftPlayer) viewer;
                      CraftEntity craftTarget = (CraftEntity) target;
                      craftViewer.getHandle().connection.send(new ClientboundSetCameraPacket(craftTarget.getHandle()));
                      return true;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              /**
               * カメラ対象を降ろさず、クライアントのチャンク送信中心だけを指定する。
               * これにより ArmorStand 視点を維持したまま、約300ブロックごとにロード中心を進める。
               */
              private boolean sendChunkCacheCenterPacket(Player viewer, Location center) {
                  try {
                      int chunkX = center.getBlockX() >> 4;
                      int chunkZ = center.getBlockZ() >> 4;
                      ((CraftPlayer) viewer).getHandle().connection.send(
                              new ClientboundSetChunkCacheCenterPacket(chunkX, chunkZ));
                      return true;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }
          '''
          s, count = re.subn(
              r'    private boolean sendSetCameraPacket\(Player viewer, org\.bukkit\.entity\.Entity target\) \{.*?\n    private boolean sendPacketByReflection\(Object connection, Object packet\) \{.*?\n    }\n',
              direct_packets, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'WarpStone packet replacement count={count}')
          p.write_text(s, encoding='utf-8')

          # WebMap: CraftBlockData -> BlockState -> MapColor を直接参照
          p = root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WebMap/WebMapModule.java'
          s = p.read_text(encoding='utf-8')
          s = s.replace('import java.lang.invoke.MethodHandle;\n', '')
          s = s.replace('import java.lang.invoke.MethodHandles;\n', '')
          s = s.replace('import java.lang.invoke.MethodType;\n', '')
          if 'import net.minecraft.core.BlockPos;' not in s:
              s = s.replace('package org.pexserver.koukunn.bettersurvival.Modules.Feature.WebMap;\n\n',
                  'package org.pexserver.koukunn.bettersurvival.Modules.Feature.WebMap;\n\n'
                  'import net.minecraft.core.BlockPos;\n'
                  'import net.minecraft.world.level.EmptyBlockGetter;\n'
                  'import net.minecraft.world.level.material.MapColor;\n')
          if 'import org.bukkit.craftbukkit.block.data.CraftBlockData;' not in s:
              s = s.replace('import org.bukkit.block.data.BlockData;\n',
                            'import org.bukkit.block.data.BlockData;\nimport org.bukkit.craftbukkit.block.data.CraftBlockData;\n')
          resolver = '''    private static final class NmsMapColorResolver {
              public static NmsMapColorResolver create() {
                  return new NmsMapColorResolver();
              }

              public int[] color(BlockData blockData) {
                  if (!(blockData instanceof CraftBlockData craftBlockData)) {
                      return null;
                  }
                  try {
                      MapColor mapColor = craftBlockData.getState().getMapColor(EmptyBlockGetter.INSTANCE, BlockPos.ZERO);
                      int color = mapColor.col;
                      if (color == 0) {
                          return null;
                      }
                      return new int[]{
                              (color >> 16) & 0xFF,
                              (color >> 8) & 0xFF,
                              color & 0xFF
                      };
                  } catch (Throwable ignored) {
                      return null;
                  }
              }

              public boolean isEnabled() {
                  return true;
              }
          }
          '''
          s, count = re.subn(
              r'    private static final class NmsMapColorResolver \{.*?\n    }\n\n    private int\[\] mix',
              resolver + '\n    private int[] mix', s, flags=re.S)
          if count != 1:
              raise SystemExit(f'WebMap resolver replacement count={count}')
          p.write_text(s, encoding='utf-8')

          # NMS reflectionが対象3ファイルに残っていないことを確認
          for path in [
              root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/ParallelFurnace/ParallelFurnaceModule.java',
              root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WarpStone/WarpStoneModule.java',
              root / 'src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WebMap/WebMapModule.java',
          ]:
              text = path.read_text(encoding='utf-8')
              bad = ['Class.forName(', 'getDeclaredMethod(', 'getDeclaredField(', 'java.lang.reflect.Method', 'java.lang.reflect.Constructor', 'MethodHandles.']
              found = [x for x in bad if x in text]
              if found:
                  raise SystemExit(f'{path}: reflection remains: {found}')

      - name: Build
        run: ./gradlew build --stacktrace
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'refactor: replace reflection NMS calls with direct mappings'
          git push origin HEAD:feature/otherworld-custom-dimension-context

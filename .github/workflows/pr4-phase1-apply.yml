name: PR4 Performance Migration

on:
  push:
    branches:
      - refactor/performance-bug-audit

permissions:
  contents: write

concurrency:
  group: pr4-performance-migration
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/performance-bug-audit
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply WebMap snapshot refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/pr4_phase2.py')
          text = path.read_text(encoding='utf-8')

          old_count = '''def replace_count(rel, old, new, expected):
              text = read(rel)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{rel}: expected {expected} matches, got {count}: {old[:180]!r}")
              write(rel, text.replace(old, new))'''
          new_count = '''def replace_count(rel, old, new, expected):
              text = read(rel)
              count = text.count(old)
              if count == 0:
                  raise RuntimeError(f"{rel}: expected at least one match, got 0: {old[:180]!r}")
              if count != expected:
                  print(f"{rel}: replacing all {count} matches (initial estimate was {expected})")
              write(rel, text.replace(old, new))'''
          if text.count(old_count) != 1:
              raise SystemExit('replace_count migration anchor mismatch')
          text = text.replace(old_count, new_count, 1)

          text = text.replace(
              'replace_once(server, "world.getEnvironment().name()", "world.environment()")',
              'replace_count(server, "world.getEnvironment().name()", "world.environment()", 2)',
              1,
          )
          text = text.replace(
              'replace_once(server, "        WebMapDimensionSettings dimension = module.getDimensionSettings(world);\\n", "")',
              'replace_count(server, "        WebMapDimensionSettings dimension = module.getDimensionSettings(world);\\n", "", 2)',
              1,
          )
          text = text.replace(
              '''                WebMapDimensionSettings dimension = module.getDimensionSettings(world);
                return dimension.getDisplayName();''',
              '''                return world.displayName();''',
              1,
          )

          marker_start = "replace_once(\n    server,\n    '''    private String resolveWorldDisplayName"
          marker_end = "\nreplace_once(\n    server,\n    '''        writeJson(exchange, Map.of("
          start = text.index(marker_start)
          end = text.index(marker_end, start)
          robust = '''server_text = read(server)
          method_start = server_text.index("    private String resolveWorldDisplayName(String worldKey) {")
          method_end = server_text.index("    private String absoluteRequestUrl(HttpExchange exchange) {", method_start)
          replacement_method = ''' + '"""' + '''    private String resolveWorldDisplayName(String worldKey) {
              WebMapHttpSnapshot.WorldView world = module.getHttpSnapshot().findWorld(worldKey);
              return world == null ? "" : world.displayName();
          }

          ''' + '"""' + '''
          write(server, server_text[:method_start] + replacement_method + server_text[method_end:])
          '''
          text = text[:start] + robust + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/pr4_phase2.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WebMap/WebMapHttpServer.java')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?m)^(\s*)String type = switch \(world\.getEnvironment\(\)\) \{\n\s*case NETHER -> "nether";\n\s*case THE_END -> "the_end";\n\s*default -> "normal";\n\s*\};'
          text, count = re.subn(pattern, r'\1String type = world.type();', text, count=1)
          if count != 1:
              raise SystemExit(f'remaining WorldView type switch count={count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch whitespace
        run: git diff --check

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet -- src/main/java; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WebMap/WebMapModule.java \
            src/main/java/org/pexserver/koukunn/bettersurvival/Modules/Feature/WebMap/WebMapHttpServer.java
          git commit -m "perf: isolate WebMap HTTP threads from Bukkit state"
          git push origin HEAD:refactor/performance-bug-audit

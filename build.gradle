plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.23'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'org.pexserver.koukunn'
version = project.findProperty("version") ?: "0.0.0-Build Error Please Contact Developer"

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = 'https://repo.opencollab.dev/main/'
    }
}

dependencies {
    paperweight.paperDevBundle("26.2.build.+")
    compileOnly('com.mojang:authlib:7.0.61')
    compileOnly('io.netty:netty-transport:4.2.7.Final')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    implementation('net.dv8tion:JDA:6.4.1') {
        exclude group: 'club.minnced', module: 'opus-java'
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT')
    implementation('org.geysermc.cumulus:cumulus:1.1.2')
    // Geyser API
    compileOnly('org.geysermc.geyser:api:2.9.0-SNAPSHOT')
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.test {
    useJUnitPlatform()
}

tasks {
    runServer {
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked', '-Xmaxwarns', '10000'])

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

def bundledYouTubeOAuthClientId = project.findProperty('youtubeOAuthClientId')
        ?: System.getenv('YOUTUBE_OAUTH_CLIENT_ID') ?: ''
def bundledYouTubeOAuthClientSecret = project.findProperty('youtubeOAuthClientSecret')
        ?: System.getenv('YOUTUBE_OAUTH_CLIENT_SECRET') ?: ''

processResources {
    def props = [
            version: project.version,
            youtubeOAuthClientId: bundledYouTubeOAuthClientId,
            youtubeOAuthClientSecret: bundledYouTubeOAuthClientSecret
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand props
    }
    filesMatching('youtube-oauth.properties') {
        expand props
    }
}

def webSiteDir = file("$projectDir/WebSite")
def webSiteDistDir = file("$projectDir/WebSite/dist")
def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('npmInstallWebSite', Exec) {
    onlyIf { webSiteDir.exists() }
    workingDir webSiteDir
    commandLine npmCommand, 'install'
    inputs.file(file("$webSiteDir/package.json"))
    outputs.dir(file("$webSiteDir/node_modules"))
}

tasks.register('buildWebSiteFrontend', Exec) {
    onlyIf { webSiteDir.exists() }
    dependsOn tasks.named('npmInstallWebSite')
    workingDir webSiteDir
    commandLine npmCommand, 'run', 'build'
    inputs.files(
            file("$webSiteDir/package.json"),
            file("$webSiteDir/vite.config.js"),
            file("$webSiteDir/index.html")
    )
    inputs.dir(file("$webSiteDir/src"))
    inputs.dir(file("$webSiteDir/public"))
    outputs.dir(webSiteDistDir)
}

processResources {
    exclude 'hardmode/TrueCrafterMode.zip'
    if (webSiteDir.exists()) {
        dependsOn tasks.named('buildWebSiteFrontend')
        from(webSiteDistDir) {
            into 'website'
        }
    }
}

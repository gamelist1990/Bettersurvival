    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".55"/></filter>
    <style>
      .ui{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:26px;font-weight:800;fill:#333}.small{font-size:13px;fill:#ddd}.slot{fill:#8b8b8b;stroke-width:4;stroke:#f4f4f4}.slot2{fill:#8b8b8b;stroke-width:4;stroke:#4c4c4c}.cap{font-size:14px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#111;stroke-width:3px}.green{fill:#71a95b}.gray{fill:#666}.blue{fill:#607aa6}.red{fill:#9d6666}
    </style>
  </defs>
  <rect width="900" height="650" fill="url(#bg)"/>
